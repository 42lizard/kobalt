name: PocketBook build and release
on:
  push:
    branches: [pocketbook-port]
    tags: ['v*pb']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocketbook-${{ github.ref }}
  cancel-in-progress: false
env:
  KOBALT_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
jobs:
  build-pocketbook:
    if: github.ref == 'refs/heads/pocketbook-port' || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, 'pb'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release version
        shell: bash
        run: |
          test "$(cat VERSION)" = "$(jq -r .version assets/manifest.json)"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            test "$(bash platforms/ci/version.sh)" = "$(cat VERSION)"
            grep -Fx "## $GITHUB_REF_NAME" doc/CHANGELOG.md
          fi
      - uses: actions/cache@v6
        with:
          path: |
            build/pocketbook/host-beta4/downloads
            build/pocketbook/arm-beta4/downloads
            build/release-source-cache
          key: pocketbook-sources-${{ runner.os }}-${{ hashFiles('dependencies/manifest.json', 'dependencies/release-sources.json', 'platforms/pocketbook/release-sources.json') }}
      - name: Build and test PocketBook
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          ./build-pocketbook.sh --test 2>&1 | tee build/pocketbook-build.log
      - name: Restore output ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build
      - name: Collect source archives
        if: startsWith(github.ref, 'refs/tags/')
        run: bash platforms/pocketbook/source-archive.sh
      - name: Stage package and build metadata
        run: |
          mkdir -p build/release
          cp build/pocketbook/Kobalt-PB743K3.zip build/pocketbook/pocketbook.json build/release/
      - uses: actions/upload-artifact@v7
        with:
          name: pocketbook-package
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pocketbook-tests
          path: |
            build/pocketbook-build.log
            build/pocketbook/host-captures/*.png
            build/pocketbook/arm-captures/*.png
            build/pocketbook/host-beta4/Testing/Temporary/LastTest.log
          retention-days: 1
  release-draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-pocketbook
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pocketbook-package
          path: build/release
      - name: Assemble PocketBook release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash platforms/pocketbook/draft-release.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
