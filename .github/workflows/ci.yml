name: PocketBook build and release

on:
  push:
    branches: [pocketbook-port]
    tags: ['v*-pocketbook.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketbook-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_ENGINE: docker
  PYTHONUNBUFFERED: '1'
  KOBALT_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  build-pocketbook:
    if: >-
      github.ref == 'refs/heads/pocketbook-port' ||
      (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-pocketbook.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tooling
        run: |
          mkdir -p build
          python3 -m unittest discover -s tests/tooling -p 'test_*release*.py'
      - name: Validate release notes and source version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          test "$(cat VERSION)" = "$RELEASE_TAG"
          python3 tools/draft_release.py --target pocketbook --notes-only --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - uses: actions/cache@v6
        with:
          path: .cache/kobalt
          key: pocketbook-sources-${{ runner.os }}-${{ hashFiles('dependencies/manifest.json') }}
      - name: Download and verify official firmware
        run: python3 tools/fetch_pocketbook_firmware.py
      - name: Build and test PocketBook
        shell: bash
        run: |
          set -o pipefail
          ./build-pocketbook.sh --firmware "$PWD/build/firmware/SWUPDATE.BIN" --jobs 4 --test 2>&1 | tee build/pocketbook-build.log
      - name: Restore ownership of container outputs
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" build .cache vendor
      - name: Stage tested package
        run: |
          mkdir -p build/release
          cp build/pocketbook/Kobalt-PB743K3.zip build/pocketbook/pocketbook.json build/release/
      - name: Collect corresponding source and dependency archives
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/release_sources.py --target pocketbook
      - uses: actions/upload-artifact@v7
        with:
          name: pocketbook-package
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pocketbook-tests
          path: |
            build/pocketbook-build.log
            build/pocketbook/arm-runtime-test/*.png
            build/pocketbook/host/app/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 1

  release-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-pocketbook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pocketbook-package
          path: build/release
      - name: Create or update PocketBook release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/draft_release.py --target pocketbook --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
